<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>
    <div id="header">
        <div id="nav">
            <div id="Top-nav">
                <div id="logo">
                    <h1 class="logo-name">
                        <i class="fa-regular fa-clock" style="color: #F3EFE7;"></i> Discovery
                    </h1>
                    <!-- <img id="logo-img" src="images/Luxury Watch Discovery Logo.png" alt="watch logo"> -->
                </div>
                <div id="top-nav-button">
                    <button id="contactusButton">Contact Us</button>
                    <button id="HomeButton">Home</button>
                    <button id="wishlistButton">Wishlist</button>
                </div>
            </div>
            <div id="bottom-nav">
                <div id="filters">
                    <div id="categories">
                        <label for="category-filter">Category:</label>
                        <select id="category-filter">
                            <option value="all">All watches</option>
                            <option value="luxury">Luxury</option>
                            <option value="sports">Sports</option>
                            <option value="digital">Digital</option>
                        </select>
                    </div>
                    <div id="strap-filter">
                        <label for="strap-filter">Strap:</label>
                        <select id="strapFilter">
                            <option value="all">All</option>
                            <option value="metal">Metal</option>
                            <option value="rubber">Rubber / Silicone</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="main">
        <div id="watchCarousel">

            <!-- Previous watch button -->
            <button id="prevWatch">&#10094;</button>

            <!-- JavaScript will place the watch cards here -->
            <div id="displayWatches"></div>

            <!-- Next watch button -->
            <button id="nextWatch">&#10095;</button>

        </div>
        <div id="individualSection">
            <!-- individual watches shown here -->
        </div>
        <div id="wishlistSection"></div>
    </div>
    <div id="footer">
        <p> 2026 Watch Discovery. All rights reserved.</p>
    </div>
    <script src="script.js"></script>
</body>

</html>
